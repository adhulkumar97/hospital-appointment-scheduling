{% extends "base.html" %}
{% block content %}

<div class="bg-gradient-primary text-white rounded p-4 mb-4 shadow-sm" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="display-6 fw-bold"><i class="fas fa-sign-in-alt me-2"></i>Patient Login</h1>
            <p class="lead mb-0">Access your health dashboard</p>
        </div>
        <i class="fas fa-hospital-user fa-4x opacity-50"></i>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 py-3">
                <h4 class="mb-0"><i class="fas fa-lock me-2 text-primary"></i>Login to Your Account</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-arrow-right me-2"></i>Login</button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">New user? <a href="{{ url_for('patient_register') }}">Register here</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-gradient-primary {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
    .card-header {
        border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .form-control, .input-group-text {
        border-radius: 8px;
    }
    .btn-primary {
        transition: all 0.2s;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
</style>

{% endblock %}
