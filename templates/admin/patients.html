{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-users me-2"></i>All Patients</h2>
<table class="table table-bordered table-hover">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for patient in patients %}
        <tr>
            <td>{{ patient.id }}</td>
            <td>{{ patient.user.name }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.gender }}</td>
            <td>{{ patient.contact }}</td>
            <td>{{ patient.user.email }}</td>
            <td>
                <a href="{{ url_for('patient_details', patient_id=patient.id) }}" class="btn btn-sm btn-info">
                    <i class="fas fa-eye me-1"></i>View Details
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
