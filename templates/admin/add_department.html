{% extends "base.html" %}
{% block content %}

<div class="bg-gradient-primary text-white rounded p-4 mb-4 shadow-sm" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 class="display-6 fw-bold"><i class="fas fa-building me-2"></i>Add New Department</h1>
            <p class="lead mb-0">Create a new medical department</p>
        </div>
        <i class="fas fa-hospital-user fa-4x opacity-50"></i>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 py-3">
                <h4 class="mb-0"><i class="fas fa-notes-medical me-2 text-primary"></i>Department Details</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-4">
                        <label class="form-label">Department Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g., Cardiology">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="fas fa-plus-circle me-2"></i>Add Department</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-gradient-primary {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
    .card-header {
        border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .form-control {
        border-radius: 8px;
        transition: all 0.2s;
    }
    .form-control:focus {
        border-color: #2a5298;
        box-shadow: 0 0 0 0.2rem rgba(42,82,152,0.25);
    }
    .btn-primary {
        transition: all 0.2s;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
</style>

{% endblock %}
